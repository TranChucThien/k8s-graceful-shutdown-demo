apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-good
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: banking-good
  template:
    metadata:
      labels:
        app: banking-good
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: banking
        image: chucthien03/banking-demo:blue-2
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "172.28.174.197"
        - name: DB_PORT
          value: "3307"
        - name: DB_NAME
          value: "banking"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "password"
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

        lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 20"]  # ✅ Đã sửa
        # lifecycle:
        #   preStop:
        #     httpGet:
        #       path: /api/drain
        #       port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: banking-good
spec:
  type: NodePort
  selector:
    app: banking-good
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
