name: Build Image with Cache & Compare Layers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Incremental tag number (1, 2, 3, ...)"
        required: true
        type: string

env:
  IMAGE: chucthien03/banking-demo

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx & Login
        run: |
          docker buildx create --name mybuilder --use
          docker buildx inspect --bootstrap
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push with cache
        run: |
          docker buildx build \
            --push \
            -t "$IMAGE:${{ inputs.tag }}" \
            --cache-from type=registry,ref="$IMAGE:inline" \
            --cache-to type=inline,mode=max \
            ./app

      - name: Compare layers with previous image
        run: |
          PREV_TAG=$(( ${{ inputs.tag }} - 1 ))

          docker pull "$IMAGE:${{ inputs.tag }}"
          docker inspect "$IMAGE:${{ inputs.tag }}" | jq -r '.[0].RootFS.Layers[]' > /tmp/new_layers.txt

          if [ "$PREV_TAG" -ge 1 ] && docker pull "$IMAGE:$PREV_TAG" 2>/dev/null; then
            docker inspect "$IMAGE:$PREV_TAG" | jq -r '.[0].RootFS.Layers[]' > /tmp/old_layers.txt
          else
            echo "## 📊 Layer Comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ️ First build (tag: ${{ inputs.tag }}), no previous image to compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## 📊 Layer Comparison: v${PREV_TAG} → v${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "%-6s %-25s %-25s %s\n" "Layer" "Old" "New" "Status" >> "$GITHUB_STEP_SUMMARY"
          printf "%-6s %-25s %-25s %s\n" "-----" "---" "---" "------" >> "$GITHUB_STEP_SUMMARY"

          IDX=0
          paste /tmp/old_layers.txt /tmp/new_layers.txt | while IFS=$'\t' read -r old new; do
            IDX=$((IDX + 1))
            old_short="${old:7:16}..."
            new_short="${new:7:16}..."
            if [ "$old" = "$new" ]; then
              printf "%-6s %-25s %-25s %s\n" "$IDX" "$old_short" "$new_short" "✔ SAME" >> "$GITHUB_STEP_SUMMARY"
            else
              printf "%-6s %-25s %-25s %s\n" "$IDX" "$old_short" "$new_short" "❌ DIFF" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          TOTAL=$(wc -l < /tmp/new_layers.txt)
          SAME=$(comm -12 <(sort /tmp/old_layers.txt) <(sort /tmp/new_layers.txt) | wc -l)
          DIFF=$((TOTAL - SAME))

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result:** $SAME/$TOTAL layers reused ($((SAME * 100 / TOTAL))% cache hit), $DIFF layer(s) changed" >> "$GITHUB_STEP_SUMMARY"
