name: Build Image with Cache & Compare Layers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Incremental tag number (1, 2, 3, ...)"
        required: true
        type: string

env:
  APP_IMAGE: chucthien03/banking-demo
  CACHE_IMAGE: chucthien03/banking-demo-cache

jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx & Login
        run: |
          docker buildx create --name mybuilder --driver docker-container --use
          docker buildx inspect --bootstrap
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull previous image (if exists)
        id: prev
        run: |
          PREV_TAG=$(( ${{ inputs.tag }} - 1 ))
          if [ "$PREV_TAG" -ge 1 ] && docker pull "$APP_IMAGE:$PREV_TAG" 2>/dev/null; then
            echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push with cache
        run: |
          docker buildx build \
            --push \
            -t "$APP_IMAGE:${{ inputs.tag }}" \
            --cache-from type=registry,ref="$CACHE_IMAGE:latest" \
            --cache-to type=registry,ref="$CACHE_IMAGE:latest",mode=max \
            ./app

      - name: Compare layers with previous image
        if: steps.prev.outputs.exists == 'true'
        run: |
          docker pull "$APP_IMAGE:${{ inputs.tag }}"

          echo "## 📊 Layer Comparison: v${{ steps.prev.outputs.tag }} → v${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          OLD_LAYERS=$(docker inspect "$APP_IMAGE:${{ steps.prev.outputs.tag }}" | jq -r '.[0].RootFS.Layers[]')
          NEW_LAYERS=$(docker inspect "$APP_IMAGE:${{ inputs.tag }}" | jq -r '.[0].RootFS.Layers[]')

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf "%-6s %-25s %-25s %s\n" "Layer" "Old" "New" "Status" >> "$GITHUB_STEP_SUMMARY"
          printf "%-6s %-25s %-25s %s\n" "-----" "---" "---" "------" >> "$GITHUB_STEP_SUMMARY"

          IDX=0
          paste <(echo "$OLD_LAYERS") <(echo "$NEW_LAYERS") | while IFS=$'\t' read -r old new; do
            IDX=$((IDX + 1))
            old_short="${old:7:16}..."
            new_short="${new:7:16}..."
            if [ "$old" = "$new" ]; then
              printf "%-6s %-25s %-25s %s\n" "$IDX" "$old_short" "$new_short" "✔ SAME" >> "$GITHUB_STEP_SUMMARY"
            else
              printf "%-6s %-25s %-25s %s\n" "$IDX" "$old_short" "$new_short" "❌ DIFF" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          TOTAL=$(echo "$NEW_LAYERS" | wc -l)
          SAME=$(comm -12 <(echo "$OLD_LAYERS" | sort) <(echo "$NEW_LAYERS" | sort) | wc -l)
          DIFF=$((TOTAL - SAME))

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result:** $SAME/$TOTAL layers reused ($((SAME * 100 / TOTAL))% cache hit), $DIFF layer(s) changed" >> "$GITHUB_STEP_SUMMARY"

      - name: No previous image
        if: steps.prev.outputs.exists != 'true'
        run: |
          echo "## 📊 Layer Comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ First build (tag: ${{ inputs.tag }}), no previous image to compare." >> "$GITHUB_STEP_SUMMARY"
